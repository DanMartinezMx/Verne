name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  checks:
    name: Typecheck, tests y fronteras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint:boundaries

  build:
    name: Build de ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: checks
    strategy:
      # Que falle una plataforma no debe ocultar si las otras están bien.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: verne-windows
            path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            label: macOS
            artifact: verne-macos
            # Universal: los runners son arm64, y un Mac Intel no puede abrir un
            # .dmg solo de Apple Silicon. Se compila lo que se publica.
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # 22.04 y no la última: el AppImage y el .deb quedan atados a la glibc
          # de la máquina que los construye, y compilar en la más nueva los deja
          # sin funcionar en distribuciones que siguen soportadas.
          - os: ubuntu-22.04
            label: Linux
            artifact: verne-linux
            path: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema de Linux (WebKitGTK)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.label }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @verne/desktop tauri build ${{ matrix.args }}

      - name: Publicar los paquetes como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
