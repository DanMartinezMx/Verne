name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  checks:
    name: Typecheck, tests y fronteras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint:boundaries

  release:
    name: Paquete de ${{ matrix.label }} → GitHub Release
    runs-on: ${{ matrix.os }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            label: macOS
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            label: Linux
            path: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema de Linux (WebKitGTK)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.label }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @verne/desktop tauri build ${{ matrix.args }}

      # Sigue en borrador: las notas las escribe el maintainer y publica a mano.
      # Cada plataforma añade sus archivos a la misma release del tag.
      - name: Añadir los paquetes a la release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.path }}
          draft: true
